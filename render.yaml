services:
  - type: web
    name: cmpes
    env: python
    rootDir: cmpes
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: ADMIN_URL
        value: secure-admin/
      - key: USE_S3
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: cmpes-db
          property: connectionString
databases:
  - name: cmpes-db
    plan: free
