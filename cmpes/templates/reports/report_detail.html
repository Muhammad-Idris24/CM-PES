{% extends "base.html" %}
{% block content %}
<section class="page-title print-hide"><h1>{{ report.get_report_type_display }}</h1><button onclick="window.print()" class="button">Print</button></section>
<article class="panel report">
  <h1>{{ report.contract.title }}</h1>
  <p><strong>Generated by:</strong> {{ report.generated_by.full_name }} | <strong>Date:</strong> {{ report.created_at|date:"Y-m-d H:i" }}</p>
  <pre>{{ report.content }}</pre>
</article>
{% endblock %}
