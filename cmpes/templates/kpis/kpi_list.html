{% extends "base.html" %}
{% block content %}
<section class="page-title"><h1>KPIs</h1>{% if user.role != "CONTRACTOR" %}<a class="button" href="{% url 'kpi_create' %}">New KPI</a>{% endif %}</section>
<section class="panel"><table><tr><th>Contract</th><th>Name</th><th>Weight</th><th>Description</th></tr>{% for kpi in kpis %}<tr><td>{{ kpi.contract.title }}</td><td>{{ kpi.name }}</td><td>{{ kpi.weight }}</td><td>{{ kpi.description }}</td></tr>{% empty %}<tr><td colspan="4">No KPIs.</td></tr>{% endfor %}</table></section>
{% endblock %}
