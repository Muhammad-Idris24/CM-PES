{% extends "base.html" %}
{% load static %}
{% block title %}Login - CMPES{% endblock %}
{% block content %}
<section class="auth-panel">
  <img class="auth-logo" src="{% static 'img/contract-management-logo.jpg' %}" alt="Contract Management System logo">
  <h1>Contract Management & Performance Evaluation</h1>
  <form method="post" class="stack">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="primary">Login</button>
  </form>
</section>
{% endblock %}
