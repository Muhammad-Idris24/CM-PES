{% extends "base.html" %}
{% block title %}{{ title }} - CMPES{% endblock %}
{% block content %}
<section class="panel">
  <div class="section-head">
    <h1>{{ title }}</h1>
  </div>
  <form method="post" enctype="multipart/form-data" class="grid-form">
    {% csrf_token %}
    {{ form.as_p }}

  </form>
</section>
{% endblock %}
